<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The HR Insights Co. - WhatsApp QR</title>
<style>
    /* Inter (SIL Open Font License), bundled so the poster renders offline */
    @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400 800;
        src: url('{{FONT_URL}}') format('woff2');
    }
    /* Brand tokens, matching styles.css */
    :root {
        --navy: #1F2A44;
        --navy-dark: #151D30;
        --teal: #4A7C7C;
        --teal-light: #E8F0F0;
        --teal-subtle: #B0CECE;
        --orange: #F25C1F;
        --structure: #5B6C84;
        --muted: #8A96A8;
        --bg-subtle: #F4F6F8;
        --border: #DFE3E8;
    }
    @page { size: A4; margin: 0; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 210mm; height: 297mm; }
    body {
        font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
        color: var(--navy);
        background: #fff;
        -webkit-font-smoothing: antialiased;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }
    .page {
        position: relative;
        width: 210mm;
        height: 297mm;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* Subtle data-grid texture in the top corner */
    .grid {
        position: absolute;
        top: 0; right: 0;
        width: 120mm; height: 120mm;
        background-image:
            linear-gradient(var(--border) 1px, transparent 1px),
            linear-gradient(90deg, var(--border) 1px, transparent 1px);
        background-size: 8mm 8mm;
        -webkit-mask-image: radial-gradient(circle at top right, #000 0%, transparent 70%);
        mask-image: radial-gradient(circle at top right, #000 0%, transparent 70%);
        opacity: 0.7;
    }

    header {
        position: relative;
        padding: 18mm 20mm 0;
    }
    .logo {
        font-size: 15pt;
        font-weight: 700;
        letter-spacing: -0.3px;
        color: var(--navy);
    }
    .logo-the { font-weight: 400; color: var(--muted); }
    .logo-insights { position: relative; }
    .logo-dot {
        position: absolute;
        top: -1.2mm; left: 5.3mm;
        width: 1.8mm; height: 1.8mm;
        background: var(--orange);
        border-radius: 50%;
    }

    .intro {
        position: relative;
        padding: 16mm 20mm 0;
    }
    .eyebrow {
        display: inline-block;
        font-size: 8.5pt;
        font-weight: 600;
        letter-spacing: 1.6px;
        text-transform: uppercase;
        color: var(--teal);
        margin-bottom: 5mm;
    }
    h1 {
        font-size: 36pt;
        line-height: 1.08;
        font-weight: 800;
        letter-spacing: -1.2px;
        color: var(--navy);
    }
    .subtext {
        margin-top: 6mm;
        max-width: 140mm;
        font-size: 12.5pt;
        line-height: 1.55;
        color: var(--structure);
    }

    .qr-area {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    .qr-card {
        position: relative;
        padding: 9mm;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 3mm;
        box-shadow: 0 4mm 12mm rgba(31, 42, 68, 0.08);
    }
    /* Teal corner brackets, like a scan frame */
    .corner {
        position: absolute;
        width: 10mm; height: 10mm;
        border: 1.2mm solid var(--teal);
    }
    .corner.tl { top: -3mm; left: -3mm; border-right: 0; border-bottom: 0; border-top-left-radius: 3mm; }
    .corner.tr { top: -3mm; right: -3mm; border-left: 0; border-bottom: 0; border-top-right-radius: 3mm; }
    .corner.bl { bottom: -3mm; left: -3mm; border-right: 0; border-top: 0; border-bottom-left-radius: 3mm; }
    .corner.br { bottom: -3mm; right: -3mm; border-left: 0; border-top: 0; border-bottom-right-radius: 3mm; }

    .qr {
        position: relative;
        width: 82mm; height: 82mm;
    }
    .qr svg { width: 100%; height: 100%; display: block; }
    .qr-badge {
        position: absolute;
        top: 50%; left: 50%;
        width: 17mm; height: 17mm;
        transform: translate(-50%, -50%);
        background: #fff;
        border-radius: 2.5mm;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .qr-badge-inner {
        position: relative;
        width: 13mm; height: 13mm;
        background: var(--navy);
        border-radius: 2mm;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 800;
        font-size: 12pt;
        letter-spacing: -0.3px;
    }
    .qr-badge-inner::after {
        content: '';
        position: absolute;
        top: 1.6mm; right: 1.6mm;
        width: 1.8mm; height: 1.8mm;
        background: var(--orange);
        border-radius: 50%;
    }

    .cta {
        margin-top: 9mm;
        display: inline-flex;
        align-items: center;
        gap: 3mm;
        padding: 3.8mm 8mm;
        background: var(--teal);
        color: #fff;
        border-radius: 1.5mm;
        font-size: 13pt;
        font-weight: 600;
    }
    .cta svg { width: 6mm; height: 6mm; }

    .steps {
        display: flex;
        justify-content: center;
        gap: 10mm;
        margin-top: 8mm;
        font-size: 9.5pt;
        color: var(--structure);
    }
    .step { display: flex; align-items: center; gap: 2.2mm; }
    .step-num {
        width: 6mm; height: 6mm;
        border-radius: 50%;
        background: var(--teal-light);
        color: var(--teal);
        font-weight: 700;
        font-size: 8.5pt;
        display: flex; align-items: center; justify-content: center;
    }

    footer {
        background: var(--navy);
        color: #fff;
        padding: 10mm 20mm;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .tagline {
        font-size: 13pt;
        font-weight: 700;
        letter-spacing: -0.2px;
    }
    .tagline span { color: var(--teal-subtle); font-weight: 400; }
    .contact {
        text-align: right;
        font-size: 10pt;
        line-height: 1.6;
        color: #D5DBE4;
    }
    .contact strong { color: #fff; font-weight: 600; }
</style>
</head>
<body>
<div class="page">
    <div class="grid" aria-hidden="true"></div>

    <header>
        <div class="logo"><span class="logo-the">The</span> HR <span class="logo-insights">Insights<span class="logo-dot"></span></span> Co.</div>
    </header>

    <section class="intro">
        <span class="eyebrow">{{EYEBROW}}</span>
        <h1>{{HEADLINE}}</h1>
        <p class="subtext">{{SUBTEXT}}</p>
    </section>

    <section class="qr-area">
        <div class="qr-card">
            <span class="corner tl"></span><span class="corner tr"></span>
            <span class="corner bl"></span><span class="corner br"></span>
            <div class="qr">
                {{QR_SVG}}
                <div class="qr-badge"><div class="qr-badge-inner">HR</div></div>
            </div>
        </div>

        <div class="cta">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3 21l2.1-5.6A8.4 8.4 0 1 1 21 11.5z"/></svg>
            {{CTA}}
        </div>

        <div class="steps">
            <div class="step"><span class="step-num">1</span>Open your camera</div>
            <div class="step"><span class="step-num">2</span>Scan the code</div>
            <div class="step"><span class="step-num">3</span>Tap send in WhatsApp</div>
        </div>
    </section>

    <footer>
        <div class="tagline">From noise <span>to</span> clarity</div>
        <div class="contact">
            <strong>{{WEBSITE}}</strong><br>
            {{EMAIL}}
        </div>
    </footer>
</div>
</body>
</html>
