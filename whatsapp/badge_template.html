<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The HR Insights Co. - WhatsApp QR tag</title>
<style>
    /* Inter (SIL Open Font License), bundled so the tag renders offline */
    @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400 800;
        src: url('{{FONT_URL}}') format('woff2');
    }
    /* Brand tokens, matching styles.css */
    :root {
        --navy: #1F2A44;
        --teal: #4A7C7C;
        --teal-subtle: #B0CECE;
        --orange: #F25C1F;
        --structure: #5B6C84;
        --muted: #8A96A8;
        --border: #DFE3E8;
    }
    @page { size: 105mm 148mm; margin: 0; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 105mm; height: 148mm; }
    body {
        font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
        color: var(--navy);
        background: #fff;
        -webkit-font-smoothing: antialiased;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }
    .tag {
        position: relative;
        width: 105mm;
        height: 148mm;
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }

    /* Subtle data-grid texture in the top corner */
    .grid {
        position: absolute;
        top: 0; right: 0;
        width: 60mm; height: 60mm;
        background-image:
            linear-gradient(var(--border) 1px, transparent 1px),
            linear-gradient(90deg, var(--border) 1px, transparent 1px);
        background-size: 5mm 5mm;
        -webkit-mask-image: radial-gradient(circle at top right, #000 0%, transparent 70%);
        mask-image: radial-gradient(circle at top right, #000 0%, transparent 70%);
        opacity: 0.7;
    }

    header {
        position: relative;
        padding: 9mm 9mm 0;
    }
    .logo {
        font-size: 10pt;
        font-weight: 700;
        letter-spacing: -0.2px;
    }
    .logo-the { font-weight: 400; color: var(--muted); }
    .logo-insights { position: relative; }
    .logo-dot {
        position: absolute;
        top: -0.8mm; left: 3.5mm;
        width: 1.2mm; height: 1.2mm;
        background: var(--orange);
        border-radius: 50%;
    }
    h1 {
        margin-top: 5mm;
        font-size: 24pt;
        line-height: 1.05;
        font-weight: 800;
        letter-spacing: -0.8px;
    }

    .qr-area {
        position: relative;
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }
    .qr-card {
        position: relative;
        padding: 5mm;
        background: #fff;
        border: 0.25mm solid var(--border);
        border-radius: 2mm;
    }
    /* Teal corner brackets, like a scan frame */
    .corner {
        position: absolute;
        width: 7mm; height: 7mm;
        border: 0.9mm solid var(--teal);
    }
    .corner.tl { top: -2mm; left: -2mm; border-right: 0; border-bottom: 0; border-top-left-radius: 2mm; }
    .corner.tr { top: -2mm; right: -2mm; border-left: 0; border-bottom: 0; border-top-right-radius: 2mm; }
    .corner.bl { bottom: -2mm; left: -2mm; border-right: 0; border-top: 0; border-bottom-left-radius: 2mm; }
    .corner.br { bottom: -2mm; right: -2mm; border-left: 0; border-top: 0; border-bottom-right-radius: 2mm; }

    .qr {
        position: relative;
        width: 56mm; height: 56mm;
    }
    .qr svg { width: 100%; height: 100%; display: block; }
    .qr-badge {
        position: absolute;
        top: 50%; left: 50%;
        width: 11.5mm; height: 11.5mm;
        transform: translate(-50%, -50%);
        background: #fff;
        border-radius: 1.8mm;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .qr-badge-inner {
        position: relative;
        width: 9mm; height: 9mm;
        background: var(--navy);
        border-radius: 1.4mm;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-weight: 800;
        font-size: 8.5pt;
    }
    .qr-badge-inner::after {
        content: '';
        position: absolute;
        top: 1.1mm; right: 1.1mm;
        width: 1.3mm; height: 1.3mm;
        background: var(--orange);
        border-radius: 50%;
    }

    .cta {
        margin-top: 5.5mm;
        display: inline-flex;
        align-items: center;
        gap: 2mm;
        padding: 2.4mm 5mm;
        background: var(--teal);
        color: #fff;
        border-radius: 1.2mm;
        font-size: 9pt;
        font-weight: 600;
    }
    .cta svg { width: 4mm; height: 4mm; }

    footer {
        margin-top: 6mm;
        background: var(--navy);
        color: #fff;
        padding: 4.5mm 9mm;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .tagline {
        font-size: 8.5pt;
        font-weight: 700;
    }
    .tagline span { color: var(--teal-subtle); font-weight: 400; }
    .website {
        font-size: 8pt;
        font-weight: 600;
    }
</style>
</head>
<body>
<div class="tag">
    <div class="grid" aria-hidden="true"></div>

    <header>
        <div class="logo"><span class="logo-the">The</span> HR <span class="logo-insights">Insights<span class="logo-dot"></span></span> Co.</div>
        <h1>{{HEADLINE}}</h1>
    </header>

    <section class="qr-area">
        <div class="qr-card">
            <span class="corner tl"></span><span class="corner tr"></span>
            <span class="corner bl"></span><span class="corner br"></span>
            <div class="qr">
                {{QR_SVG}}
                <div class="qr-badge"><div class="qr-badge-inner">HR</div></div>
            </div>
        </div>

        <div class="cta">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.4L3 21l2.1-5.6A8.4 8.4 0 1 1 21 11.5z"/></svg>
            {{CTA}}
        </div>
    </section>

    <footer>
        <div class="tagline">From noise <span>to</span> clarity</div>
        <div class="website">{{WEBSITE}}</div>
    </footer>
</div>
</body>
</html>
